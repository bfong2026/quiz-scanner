<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grade 6 Math Quiz & OMR Scanner</title>
<style>
  :root {
    --primary: #1e3a8a;
    --accent: #2563eb;
    --bg: #f8fafc;
    --card: #ffffff;
    --border: #cbd5e1;
    --text: #0f172a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 16px;
    -webkit-print-color-adjust: exact !important;
    print-color-adjust: exact !important;
  }

  /* Screen UI Controls */
  .no-print {
    max-width: 900px;
    margin: 0 auto 20px auto;
  }
  .header-panel {
    background: var(--card);
    padding: 16px 20px;
    border-radius: 10px;
    box-shadow: 0 4px 6px -1px rgba(0,0,0,0.08);
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 12px;
    border: 1px solid var(--border);
  }
  h1 { margin: 0; font-size: 1.25rem; color: var(--primary); }
  .btn-group { display: flex; gap: 8px; flex-wrap: wrap; }
  button {
    background: var(--primary);
    color: white;
    border: none;
    padding: 8px 14px;
    font-size: 0.9rem;
    font-weight: 600;
    border-radius: 6px;
    cursor: pointer;
  }
  button:hover { background: var(--accent); }
  button.secondary {
    background: #f1f5f9;
    color: #334155;
    border: 1px solid var(--border);
  }
  button.secondary:hover { background: #e2e8f0; }

  .panel {
    background: var(--card);
    padding: 16px;
    border-radius: 10px;
    border: 1px solid var(--border);
  }
  .scanner-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
  }
  @media (max-width: 768px) {
    .scanner-grid { grid-template-columns: 1fr; }
  }
  video, canvas {
    width: 100%;
    border-radius: 6px;
    background: #000;
    border: 1px solid var(--border);
  }
  table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 10px;
    font-size: 0.85rem;
  }
  th, td {
    padding: 6px 10px;
    border-bottom: 1px solid var(--border);
    text-align: left;
  }
  th { background: #f8fafc; font-weight: 600; }

  /* Printable Sheet Styling */
  .printable-page {
    background: white;
    width: 8.0in;
    height: 10.5in;
    max-height: 10.5in;
    margin: 20px auto;
    padding: 0.35in 0.35in 0.3in 0.35in;
    position: relative;
    box-shadow: 0 0 10px rgba(0,0,0,0.15);
    display: flex;
    flex-direction: column;
    box-sizing: border-box;
    overflow: hidden;
  }

  /* High-Contrast SVG Registration Corner Blocks */
  .reg-mark {
    position: absolute;
    width: 22px;
    height: 22px;
    line-height: 0;
  }
  .reg-tl { top: 0.2in; left: 0.2in; }
  .reg-tr { top: 0.2in; right: 0.2in; }
  .reg-bl { bottom: 0.2in; left: 0.2in; }
  .reg-br { bottom: 0.2in; right: 0.2in; }

  .quiz-header {
    border-bottom: 2px solid #000;
    padding-bottom: 4px;
    margin-bottom: 8px;
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
  }
  .quiz-header h2 { margin: 0; font-size: 1.15rem; text-transform: uppercase; }
  .student-fields { display: flex; gap: 16px; font-size: 0.85rem; font-weight: bold; }
  .underline-fill { display: inline-block; border-bottom: 1.5px solid #000; width: 130px; height: 14px; }

  .quiz-body {
    display: grid;
    grid-template-columns: 69% 31%;
    gap: 12px;
    flex-grow: 1;
  }

  .questions-col {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .question-item {
    font-size: 0.78rem;
    line-height: 1.2;
  }
  .q-title { font-weight: bold; margin-bottom: 2px; }
  .mc-options {
    margin-left: 10px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1px 6px;
  }

  .omr-col {
    border-left: 2px dashed #64748b;
    padding-left: 10px;
    display: flex;
    flex-direction: column;
  }
  .omr-instruction {
    font-size: 0.7rem;
    text-align: center;
    font-weight: bold;
    color: #0f172a;
    margin-bottom: 4px;
    border-bottom: 1px solid #94a3b8;
    padding-bottom: 2px;
  }
  .version-picker {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: #e2e8f0;
    padding: 4px 6px;
    border-radius: 4px;
    margin-bottom: 8px;
    font-size: 0.75rem;
    font-weight: bold;
  }
  .bubble-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 24px;
    padding: 0 2px;
    border-bottom: 1px dotted #cbd5e1;
  }
  .bubble-q-num {
    font-weight: bold;
    font-size: 0.78rem;
    width: 20px;
  }
  .bubble-options {
    display: flex;
    gap: 6px;
  }
  .bubble {
    width: 15px;
    height: 15px;
    border: 1.6px solid #000;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.6rem;
    font-weight: bold;
  }

  .written-section {
    margin-top: 4px;
    border: 1.5px solid #000;
    border-radius: 4px;
    padding: 6px;
  }
  .written-section h4 { margin: 0 0 2px 0; font-size: 0.78rem; }
  .written-box { height: 50px; width: 100%; }

  /* Strict Single-Page Print Setup */
  @page {
    size: letter portrait;
    margin: 0.25in;
  }
  @media print {
    html, body {
      background: #fff !important;
      margin: 0 !important;
      padding: 0 !important;
      height: 100% !important;
    }
    .no-print { display: none !important; }
    .printable-page {
      box-shadow: none !important;
      border: none !important;
      margin: 0 auto !important;
      width: 100% !important;
      height: 10.4in !important;
      max-height: 10.4in !important;
      page-break-inside: avoid !important;
      page-break-after: always !important;
      padding: 0.3in 0.3in 0.25in 0.3in !important;
    }
  }
</style>
</head>
<body>

<div class="no-print">
  <div class="header-panel">
    <div>
      <h1>Place Value Quiz Generator & OMR Scanner</h1>
      <small>Grade 6 Math Assessment • 1-Page Letter Layout</small>
    </div>
    <div class="btn-group">
      <button onclick="window.print()">🖨️ Print Quizzes (A, B, C, D)</button>
      <button class="secondary" onclick="toggleScanner()">📷 Open Scanner</button>
      <button class="secondary" onclick="exportCSV()">📥 Export Gradebook CSV</button>
    </div>
  </div>

  <div id="scannerSection" class="panel" style="display:none; margin-top:14px;">
    <h2>Sheet Scanner & Auto-Marking</h2>
    <div class="scanner-grid">
      <div>
        <video id="webcam" autoplay playsinline muted></video>
        <div style="margin-top:8px; display:flex; gap:8px;">
          <button onclick="startCamera()">Turn On Camera</button>
          <button class="secondary" onclick="captureAndProcess()">Scan Page</button>
          <input type="file" id="fileInput" accept="image/*" style="display:none" onchange="handleFileUpload(event)">
          <button class="secondary" onclick="document.getElementById('fileInput').click()">Upload Photo</button>
        </div>
      </div>
      <div>
        <canvas id="procCanvas"></canvas>
        <div id="scanResult" style="margin-top:8px; font-size:0.9rem; font-weight:600;"></div>
      </div>
    </div>
  </div>

  <div class="panel" style="margin-top:14px;">
    <h3>Class Scores (<span id="scoreCount">0</span> Submissions)</h3>
    <table id="scoresTable">
      <thead>
        <tr>
          <th>Student ID</th>
          <th>Version</th>
          <th>Score (MC /10)</th>
          <th>Percentage</th>
          <th>Timestamp</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>
</div>

<div id="quizSheetsContainer"></div>

const svgBlock = `<svg width="22" height="22" viewBox="0 0 22 22"><rect width="22" height="22" fill="#000000" /></svg>`;

function renderQuizzes() {
  const container = document.getElementById("quizSheetsContainer");
  container.innerHTML = "";

  quizVersions.forEach((quiz) => {
    const page = document.createElement("div");
    page.className = "printable-page";

    page.innerHTML = `
      <div class="reg-mark reg-tl">${svgBlock}</div>
      <div class="reg-mark reg-tr">${svgBlock}</div>
      <div class="reg-mark reg-bl">${svgBlock}</div>
      <div class="reg-mark reg-br">${svgBlock}</div>

      <div class="quiz-header">
        <div>
          <h2>Grade 6 Math: Place Value</h2>
        </div>
        <div class="student-fields">
          <div>NAME: <span class="underline-fill"></span></div>
          <div>DATE: <span class="underline-fill" style="width:75px;"></span></div>
        </div>
      </div>

      <div class="quiz-body">
        <div class="questions-col">
          ${quiz.questions.map((q, idx) => `
            <div class="question-item">
              <div class="q-title">${idx + 1}. ${q.q}</div>
              <div class="mc-options">
                ${q.opts.map((opt, oIdx) => `
                  <div><strong>${String.fromCharCode(65 + oIdx)}.</strong> ${opt}</div>
                `).join('')}
              </div>
            </div>
          `).join('')}

          <div class="written-section">
            <h4>Question 11 (Math Reasoning):</h4>
            <div style="font-size:0.75rem; margin-bottom:2px;">${quiz.q11}</div>
            <div class="written-box"></div>
          </div>
        </div>

        <div class="omr-col">
          <div class="omr-instruction">BUBBLE ANSWERS (●)</div>
          
          <div class="version-picker">
            <span>VERSION:</span>
            <div class="bubble-options">
              ${['A','B','C','D'].map(v => `
                <div class="bubble" style="${v === quiz.version ? 'background:#000; color:#fff;' : ''}">${v}</div>
              `).join('')}
            </div>
          </div>

          ${[...Array(10)].map((_, i) => `
            <div class="bubble-row">
              <span class="bubble-q-num">${i + 1}.</span>
              <div class="bubble-options">
                <div class="bubble">A</div>
                <div class="bubble">B</div>
                <div class="bubble">C</div>
                <div class="bubble">D</div>
              </div>
            </div>
          `).join('')}

          <div style="margin-top:14px; font-size:0.72rem; border:1px solid #94a3b8; border-radius:4px; padding:4px; background:#f8fafc;">

let videoStream = null;
const scoredRoster = [];

function toggleScanner() {
  const panel = document.getElementById("scannerSection");
  panel.style.display = panel.style.display === "none" ? "block" : "none";
}

async function startCamera() {
  try {
    videoStream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: "environment", width: { ideal: 1920 }, height: { ideal: 1080 } }
    });
    document.getElementById("webcam").srcObject = videoStream;
  } catch (err) {
    alert("Camera access error: " + err.message + "\nYou can use 'Upload Photo' instead.");
  }
}

function handleFileUpload(event) {
  const file = event.target.files[0];
  if (!file) return;
  const img = new Image();
  img.onload = () => processImage(img);
  img.src = URL.createObjectURL(file);
}

function captureAndProcess() {
  const video = document.getElementById("webcam");
  if (!video.videoWidth) {
    alert("Camera not started yet.");
    return;
  }
  const offCanvas = document.createElement("canvas");
  offCanvas.width = video.videoWidth;
  offCanvas.height = video.videoHeight;
  const ctx = offCanvas.getContext("2d");
  ctx.drawImage(video, 0, 0);
  processImage(offCanvas);
}

function processImage(imgSource) {
  const canvas = document.getElementById("procCanvas");
  const ctx = canvas.getContext("2d");
  
  const W = 800;
  const H = 1050;
  canvas.width = W;
  canvas.height = H;
  ctx.drawImage(imgSource, 0, 0, W, H);

  const imgData = ctx.getImageData(0, 0, W, H);
  const data = imgData.data;

  function sampleBubbleDarkness(cx, cy, radius = 7) {
    let darkPixels = 0;
    let total = 0;
    for (let y = cy - radius; y <= cy + radius; y++) {
      for (let x = cx - radius; x <= cx + radius; x++) {
        if (x < 0 || x >= W || y < 0 || y >= H) continue;
        const idx = (Math.floor(y) * W + Math.floor(x)) * 4;
        const brightness = (data[idx] + data[idx + 1] + data[idx + 2]) / 3;
        if (brightness < 110) darkPixels++;
        total++;
      }
    }
    return darkPixels / total;
  }

  const vY = H * 0.115;
  const versionXs = [W * 0.865, W * 0.90, W * 0.935, W * 0.97];
  let detectedVersion = "A";
  let maxVDarkness = -1;
  const vLetters = ['A', 'B', 'C', 'D'];

  versionXs.forEach((x, i) => {
    const darkness = sampleBubbleDarkness(x, vY);
    if (darkness > maxVDarkness) {
      maxVDarkness = darkness;
      detectedVersion = vLetters[i];
    }
  });

  const bubbleOptionsX = [W * 0.81, W * 0.855, W * 0.90, W * 0.945];
  const qStartY = H * 0.145;
  const qRowHeight = H * 0.026;

  const detectedAnswers = [];
  const chosenKey = quizVersions.find(v => v.version === detectedVersion) || quizVersions[0];

  for (let q = 0; q < 10; q++) {
    const cy = qStartY + q * qRowHeight;
    let maxDark = -1;
    let chosenOption = "-";

    bubbleOptionsX.forEach((cx, oIdx) => {
      const d = sampleBubbleDarkness(cx, cy);
      ctx.strokeStyle = d > 0.4 ? "red" : "green";
      ctx.lineWidth = 2;
      ctx.strokeRect(cx - 7, cy - 7, 14, 14);

      if (d > maxDark && d > 0.35) {
        maxDark = d;
        chosenOption = String.fromCharCode(65 + oIdx);
      }
    });
    detectedAnswers.push(chosenOption);
  }

  let correctCount = 0;
  chosenKey.questions.forEach((q, idx) => {
    if (detectedAnswers[idx] === q.ans) correctCount++;
  });

  const percentage = Math.round((correctCount / 10) * 100);
  const studentID = "STU-" + String(scoredRoster.length + 1).padStart(3, '0');

  document.getElementById("scanResult").innerHTML = `
    ✅ Scanned: Version <strong>${detectedVersion}</strong> | 
    Score: <strong>${correctCount}/10 (${percentage}%)</strong>
  `;

  scoredRoster.push({
    id: studentID,
    version: detectedVersion,
    score: correctCount,
    pct: percentage + "%",
    time: new Date().toLocaleTimeString()
  });
  updateScoreTable();
}

function updateScoreTable() {
  const tbody = document.querySelector("#scoresTable tbody");
  tbody.innerHTML = "";
  scoredRoster.forEach(row => {
    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td>${row.id}</td>
      <td><strong>${row.version}</strong></td>
      <td>${row.score}/10</td>
      <td>${row.pct}</td>
      <td>${row.time}</td>
    `;
    tbody.prepend(tr);
  });
  document.getElementById("scoreCount").innerText = scoredRoster.length;
}

function exportCSV() {
  if (scoredRoster.length === 0) {
    alert("No student results recorded yet.");
    return;
  }
  let csv = "StudentID,Version,Score_Out_Of_10,Percentage,Timestamp\n";
  scoredRoster.forEach(r => {
    csv += `${r.id},${r.version},${r.score},${r.pct},${r.time}\n`;
  });
  const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
  const url = URL.createObjectURL(blob);
  const link = document.createElement("a");
  link.setAttribute("href", url);
  link.setAttribute("download", `PlaceValue_Scores_${new Date().toISOString().slice(0,10)}.csv`);
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
}

renderQuizzes();
</script>
</body>
</html>
